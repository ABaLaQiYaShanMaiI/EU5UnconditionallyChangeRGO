 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "原材料"
 hint_UnconditionallyChangeRGO_hint_text:0 "原材料\n\n上方 7 个分类按钮：点一次后先选原材料，再选地点。下方 3 个开关：点一次切换一次。\n\n- 花费开关：开启后按所选货物在该地点市场的实时价格分六档收费（约 5 / 10 / 16 / 24 / 34 / 50 金）；供不应求时收费跳到更高一档。关闭则免费\n- 冷却开关：开启后每次修改产生 6 个月冷却，期间按钮变灰；关闭会立即清除冷却\n- 制成品开关：默认关闭。制成品是建筑产出，作为原材料属非原生玩法，可能影响建筑产出\n\n悬停任意按钮可看到该分类包含哪些货物。"

