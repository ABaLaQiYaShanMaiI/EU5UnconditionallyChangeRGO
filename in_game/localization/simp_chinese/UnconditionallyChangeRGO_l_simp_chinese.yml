 RGO_toggle_cost_desc:0 "开：按所选货物在该市场里的实时价格分六档收费（约 5 / 10 / 16 / 24 / 34 / 50 金）；供不应求导致价格上跳时，收费自动跳到更高一档。关：完全免费。"
