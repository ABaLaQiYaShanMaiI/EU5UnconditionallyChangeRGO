l_simp_chinese:
 # Generated by tools\generate_rgo_localization.ps1 - do not edit by hand
 # Category descriptions describe the runtime goods rules (no fixed goods list)

 # Situation
 UnconditionallyChangeRGO:0 "原材料"
 UnconditionallyChangeRGO_desc:0 "免费或按市场价，修改本国任意地点的原材料。"

 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "原材料"
 hint_UnconditionallyChangeRGO_hint_text:0 "原材料\n\n上方 7 个分类按钮：点一次后先选原材料，再选地点。下方 4 个开关：点一次切换一次。\n\n- 花费开关：开启后按所选货物在该地点市场的实时价格分六档收费（约 5 / 10 / 16 / 24 / 34 / 50 金）；供不应求时收费跳到更高一档。关闭则免费\n- 冷却开关：开启后每次修改产生 6 个月冷却，期间按钮变灰；关闭会立即清除冷却\n- 制成品开关：默认关闭。制成品是建筑产出，作为原材料属非原生玩法，可能影响建筑产出\n- 地理条件开关：默认关闭。关闭时本国任意地点都能改成任意原材料，即使原版的气候、植被、地形并不允许；开启后只列出原版允许该货物的地点。\n- 兼容性：分类在运行时按货物自身属性（分类、采集方式、食物值）判定，其它模组或后续版本新增的货物会自动归入对应分类；只有「种植园」用的是打包时的原版清单。\n\n悬停任意按钮可看到该分类的判定规则。"

 # Action card title (overrides the engine UI-library placeholder title)
 RGO_CARD_HEADER:0 "原材料操作"

 # Selection steps
 RGO_select_goods:0 "选择原材料"
 RGO_select_location:0 "选择地点"
 RGO_no_goods_available:0 "@trigger_no!没有可选的原材料"
 RGO_no_locations_available:0 "@trigger_no!没有符合条件的地点"

 # Category buttons (7)
 RGO_change_mining:0 "矿物"
 RGO_change_mining_desc:0 "改为矿物类：采集方式为「采矿」的原材料。"
 RGO_change_gathering:0 "采集"
 RGO_change_gathering_desc:0 "改为采集类：采集方式为「采集」的原材料。"
 RGO_change_crops:0 "经济作物"
 RGO_change_crops_desc:0 "改为经济作物 / 奢侈原料：采集方式为「农耕」、既不是食物也不是种植园作物的原材料。"
 RGO_change_food:0 "食物"
 RGO_change_food_desc:0 "改为食物类：采集方式为「农耕」且能提供食物的原材料。"
 RGO_change_plantation:0 "种植园"
 RGO_change_plantation_desc:0 "改为种植园作物：原版种植园清单中的作物。"
 RGO_change_wild:0 "狩猎林业"
 RGO_change_wild_desc:0 "改为狩猎 / 林业类：既不是采矿、采集也不是农耕的原材料。"
 RGO_change_produced:0 "制成品"
 RGO_change_produced_desc:0 "改为制成品：分类为「制成品」的货物（奴隶除外）。\n非原生玩法，可能影响建筑产出。默认关闭，需先在下方开启。"

 # Switches (4)
 RGO_toggle_cost:0 "花费开关"
 RGO_toggle_cost_desc:0 "开：按所选货物在该市场里的实时价格分六档收费（约 5 / 10 / 16 / 24 / 34 / 50 金）；供不应求导致价格上跳时，收费自动跳到更高一档。关：完全免费。"
 RGO_toggle_cooldown:0 "冷却开关"
 RGO_toggle_cooldown_desc:0 "开：每次修改产生 6 个月冷却。关：无冷却，并立即清除当前冷却。"
 RGO_toggle_produced:0 "制成品开关"
 RGO_toggle_produced_desc:0 "显示 / 隐藏「制成品」按钮。默认关闭。"
 RGO_toggle_geo:0 "地理条件开关"
 RGO_toggle_geo_desc:0 "开：只列出原版允许该货物的地点（气候、植被、地形、区域等）。关：本国任意地点都能改成任意原材料。默认关闭。"

 # Current state shown in the switch tooltip (chosen by trigger at hover time)
 RGO_toggle_state_on:0 "当前：开启 —— 点击后关闭"
 RGO_toggle_state_off:0 "当前：关闭 —— 点击后开启"

 # Price name (confirmation dialog) + price scale reasons (ScaleReason)
 rgo_change:0 "修改原材料"
 RGO_PRICE_TIER:0 "按该货物在本地市场的实时价格分档调整（共六档）"
 RGO_PRICE_FREE:0 "免费：花费开关已关闭，或该地点不在任何市场内"

 # Cooldown static modifier
 STATIC_MODIFIER_NAME_rgo_change_cooldown:0 "原材料冷却"
 STATIC_MODIFIER_DESC_rgo_change_cooldown:0 "原材料的修改仍在冷却中，冷却结束前无法再次修改。"

 # Price cost-modifier type (rgo_change_cost_modifier)
 MODIFIER_TYPE_NAME_rgo_change_cost_modifier:0 "原材料修改花费"
 MODIFIER_TYPE_DESC_rgo_change_cost_modifier:0 "影响修改地点原材料所需的费用。"
