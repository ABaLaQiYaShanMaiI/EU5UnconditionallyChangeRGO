 # Category buttons (7)
 RGO_change_mining:0 "矿物"
 RGO_change_mining_desc:0 "改为矿物类（13 种）：明矾、煤炭、铜、宝石、黄金、铁、铅、大理石、水银、硝石、白银、石料、锡。"
 RGO_change_gathering:0 "采集"
 RGO_change_gathering_desc:0 "改为采集类（7 种）：琥珀、黏土、鱼类、药物、珍珠、盐、沙砾。"
 RGO_change_crops:0 "经济作物"
 RGO_change_crops_desc:0 "改为经济作物 / 奢侈原料（14 种）：骆驼、辣椒、丁香、可可、咖啡、染料、大象、纤维作物、熏香、胡椒、藏红花、丝绸、茶叶、葡萄酒。"
 RGO_change_food:0 "食物"
 RGO_change_food_desc:0 "改为食物类（12 种）：蜂蜡、水果、马匹、豆类、牲畜、玉米、杂谷、橄榄、马铃薯、稻米、小麦、羊毛。"
 RGO_change_plantation:0 "种植园"
 RGO_change_plantation_desc:0 "改为种植园作物（3 种）：棉花、糖、烟草。"
 RGO_change_wild:0 "狩猎林业"
 RGO_change_wild_desc:0 "改为狩猎 / 林业类（4 种）：毛皮、象牙、木材、野味。"
 RGO_change_produced:0 "制成品"
 RGO_change_produced_desc:0 "改为制成品（21 种）：啤酒、书籍、火炮、布匹、精纺品、火器、家具、玻璃、珠宝、漆器、皮革、烈酒、砖块、船具、纸张、瓷器、陶器、钢、焦油、工具、武器。\n非原生玩法，可能影响建筑产出。默认关闭，需先在下方开启。"

