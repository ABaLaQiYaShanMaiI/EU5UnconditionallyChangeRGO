l_simp_chinese:
 # 局势
 UnconditionallyChangeRGO:0 "原产物"
 UnconditionallyChangeRGO_desc:0 "免费或按市场价，修改本国任意地块的原产物。"
 hint_UnconditionallyChangeRGO:0 "原产物\n\n上方七个按钮：点一次即进入修改（选原产物 → 选地块）。\n下方九个开关：点一次切换一次。\n\n- 花费开关：开启后按所选货物在该地块市场的实时价格收费，随供需涨跌（约 5~60 金）；关闭则免费\n- 冷却开关：开启后每次修改产生 6 个月冷却，期间按钮变灰；关闭会立即清除冷却\n- 工业开关：默认关闭。工业制品是建筑产出，作为原产物属非原生玩法，可能影响建筑产出\n\n悬停任意按钮可看到该分类包含哪些货物。"

 # 卡片标题
 RGO_CARD_TITLE:0 "原产物"

 # 选择步骤
 select_goods:0 "选择原产物"
 select_location:0 "选择地块"
 trigger_no_rgo_goods:0 "没有可选的原产物"
 trigger_no_rgo_locations:0 "没有符合条件的地块"

 # 七个分类（按钮只显示两字，详情在悬停提示里）
 RGO_change_mining:0 "矿物"
 RGO_change_mining_desc:0 "改为矿物类（13 种）：煤、铁、铜、黄金、银、宝石、石料、锡、铅、硝石、明矾、大理石、水银。"
 RGO_change_gathering:0 "采集"
 RGO_change_gathering_desc:0 "改为采集类（7 种）：黏土、沙、盐、药材、珍珠、琥珀、鱼。"
 RGO_change_crops:0 "作物"
 RGO_change_crops_desc:0 "改为经济作物/奢侈原料（14 种）：丝、染料、香、茶、可可、咖啡、纤维作物、葡萄酒、象、骆驼、藏红花、胡椒、丁香、辣椒。"
 RGO_change_food:0 "食物"
 RGO_change_food_desc:0 "改为食物类（12 种）：小麦、玉米、稻米、小米、豆类、马铃薯、牲畜、羊毛、马、橄榄、水果、蜂蜡。"
 RGO_change_plantation:0 "种植园"
 RGO_change_plantation_desc:0 "改为种植园作物（3 种）：棉花、蔗糖、烟草。"
 RGO_change_wild:0 "狩猎"
 RGO_change_wild_desc:0 "改为狩猎/林业类（4 种）：象牙、野味、毛皮、木材。"
 RGO_change_industry:0 "工业"
 RGO_change_industry_desc:0 "改为工业制品（22 种）：布匹、纸张、玻璃、瓷器、火炮、珠宝… 非原生玩法，可能影响建筑产出。默认关闭，需先在下方开启。"

 # 九个开关（点一次切换一次）
 RGO_toggle_cost:0 "花费开关"
 RGO_toggle_cost_desc:0 "开：按所选货物的市场实时价收费（随供需涨跌，约 5~60 金）。关：完全免费。"
 RGO_toggle_cooldown:0 "冷却开关"
 RGO_toggle_cooldown_desc:0 "开：每次修改产生 6 个月冷却。关：无冷却，并立即清除当前冷却。"
 RGO_toggle_cat_mining:0 "矿物开关"
 RGO_toggle_cat_mining_desc:0 "显示 / 隐藏「矿物」按钮。"
 RGO_toggle_cat_gathering:0 "采集开关"
 RGO_toggle_cat_gathering_desc:0 "显示 / 隐藏「采集」按钮。"
 RGO_toggle_cat_crops:0 "作物开关"
 RGO_toggle_cat_crops_desc:0 "显示 / 隐藏「作物」按钮。"
 RGO_toggle_cat_food:0 "食物开关"
 RGO_toggle_cat_food_desc:0 "显示 / 隐藏「食物」按钮。"
 RGO_toggle_cat_plantation:0 "种植园开关"
 RGO_toggle_cat_plantation_desc:0 "显示 / 隐藏「种植园」按钮。"
 RGO_toggle_cat_wild:0 "狩猎开关"
 RGO_toggle_cat_wild_desc:0 "显示 / 隐藏「狩猎」按钮。"
 RGO_toggle_cat_industry:0 "工业开关"
 RGO_toggle_cat_industry_desc:0 "显示 / 隐藏「工业」按钮。默认关闭。"

 # 价格名（确认页显示）
 rgo_change:0 "修改原产物"

 # 冷却修正器
 STATIC_MODIFIER_NAME_rgo_change_cooldown:0 "原产物冷却"
 STATIC_MODIFIER_DESC_rgo_change_cooldown:0 "原产物修改的冷却尚未结束，冷却期间无法再次修改。"
