 RGO_toggle_cooldown:0 "Abklingzeit an/aus"
 RGO_toggle_cooldown_desc:0 "An: Jede Änderung erzeugt 6 Monate Abklingzeit. Aus: keine Abklingzeit, eine laufende wird sofort entfernt."
 RGO_toggle_produced:0 "Fertigwaren an/aus"
