 UnconditionallyChangeRGO:0 "Rohstoffe"
 UnconditionallyChangeRGO_desc:0 "Ändert den Rohstoff jedes Ortes in eurem Besitz - kostenlos oder zum Marktpreis."

 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "Rohstoffe"
 hint_UnconditionallyChangeRGO_hint_text:0 "Rohstoffe\n\nKlickt auf eine Kategorie und wählt dann einen Rohstoff und einen Ort. Die Schalter lassen sich per Klick umlegen.\n\n- Kosten: zahlt den aktuellen Marktpreis der Ware am Markt des Ortes in sechs Stufen (etwa 5 / 10 / 16 / 24 / 34 / 50 Gold). Aus: alles kostenlos.\n- Abklingzeit: Jede Änderung erzeugt 6 Monate Abklingzeit, die Buttons werden ausgegraut. Beim Ausschalten wird eine laufende Abklingzeit sofort entfernt.\n- Fertigwaren: standardmäßig aus. Fertigwaren entstehen in Gebäuden; sie als Rohstoff zu nutzen ist kein Vanilla-Verhalten und kann die Gebäudeproduktion stören.\n- Geografie: standardmäßig aus. Aus: jeder eigene Ort kann jeden Rohstoff erhalten, auch wenn Klima, Vegetation oder Gelände es in Vanilla nicht zulassen. An: nur Orte, die das Spiel zulässt.\n- Kompatibilität: Die Kategorien werden zur Laufzeit aus den Waren-Daten (Kategorie, Gewinnungsart, Nahrungswert) bestimmt, daher erscheinen Waren aus anderen Mods oder späteren Patches automatisch in der richtigen Kategorie. Nur Plantagen nutzt eine beim Bau des Mods festgehaltene Liste.\n\nFahrt über einen Button, um die Regel der Kategorie zu sehen."

