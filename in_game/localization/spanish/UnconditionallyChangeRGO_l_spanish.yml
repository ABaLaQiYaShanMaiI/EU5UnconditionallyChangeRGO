 # Generated by tools\generate_rgo_localization.ps1 - do not edit by hand
 # Goods names come from the vanilla goods_l_<lang>.yml; counts and lists from common\goods

 # Situation
 UnconditionallyChangeRGO:0 "Materias primas"
 UnconditionallyChangeRGO_desc:0 "Cambia la materia prima de cualquier lugar que poseas: gratis o a precio de mercado."

 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "Materias primas"
 hint_UnconditionallyChangeRGO_hint_text:0 "Materias primas\n\nPulsa una categoría y elige después una materia prima y un lugar. Los interruptores se cambian con un clic.\n\n- Coste: cobra el precio real del mercado del lugar en seis tramos (unos 5 / 10 / 16 / 24 / 34 / 50 de oro). Desactivado: todo gratis.\n- Enfriamiento: cada cambio impone 6 meses de enfriamiento y los botones se atenúan. Al desactivarlo se elimina de inmediato el enfriamiento activo.\n- Manufacturas: desactivado por defecto. Se fabrican en edificios; usarlas como materia prima no es comportamiento vanilla y puede afectar a la producción.\n- Geografía: desactivada por defecto. Desactivada, cualquier lugar propio puede recibir cualquier materia prima aunque el clima, la vegetación o el relieve no lo permitan en vanilla. Activada, solo se ofrecen los lugares aceptados por el juego.\n\nPasa el cursor por un botón para ver las mercancías de su categoría."

 # Action card title (overrides the engine UI-library placeholder title)
 RGO_CARD_HEADER:0 "Acciones de materias primas"

 # Selection steps
 RGO_select_goods:0 "Elegir materia prima"
 RGO_select_location:0 "Elegir lugar"
 RGO_no_goods_available:0 "@trigger_no!No hay materias primas disponibles"
 RGO_no_locations_available:0 "@trigger_no!No hay lugares válidos"

 # Category buttons (7)
 RGO_change_mining:0 "Minería"
 RGO_change_mining_desc:0 "Mercancías mineras (13): Alumbre, Carbón, Cobre, Gemas, Oro, Hierro, Plomo, Mármol, Mercurio, Salitre, Plata, Piedra, Estaño."
 RGO_change_gathering:0 "Recolección"
 RGO_change_gathering_desc:0 "Mercancías de recolección (7): Ámbar, Arcilla, Pescado, Medicamentos, Perlas, Sal, Arena."
 RGO_change_crops:0 "Cultivos comerciales"
 RGO_change_crops_desc:0 "Cultivos comerciales y materias primas de lujo (14): Camellos, Chile, Clavo, Cacao, Café, Tintes, Elefantes, Cultivos fibrosos, Incienso, Pimienta, Azafrán, Seda, Té, Vino."
 RGO_change_food:0 "Alimentos"
 RGO_change_food_desc:0 "Mercancías alimentarias (12): Cera de abeja, Fruta, Caballos, Legumbres, Ganado, Maíz, Cereales resistentes, Aceitunas, Patatas, Arroz, Trigo, Lana."
 RGO_change_plantation:0 "Plantaciones"
 RGO_change_plantation_desc:0 "Mercancías de plantación (3): Algodón, Azúcar, Tabaco."
 RGO_change_wild:0 "Caza y bosque"
 RGO_change_wild_desc:0 "Mercancías de caza y bosque (4): Pieles, Marfil, Madera, Caza salvaje."
 RGO_change_produced:0 "Manufacturas"
 RGO_change_produced_desc:0 "Manufacturas (21): Cerveza, Libros, Cañones, Telas, Telas finas, Armas de fuego, Mobiliario, Vidrio, Joyería, Lacado, Cuero, Licor, Mampostería, Suministros navales, Papel, Porcelana, Cerámica, Acero, Alquitrán, Herramientas, Armamento.\nComportamiento no vanilla, puede afectar a la producción. Desactivado por defecto."

 # Switches (4)
 RGO_toggle_cost:0 "Coste on/off"
 RGO_toggle_cost_desc:0 "Activado: cobra el precio real del mercado en seis tramos (unos 5 / 10 / 16 / 24 / 34 / 50 de oro); si escasea, sube de tramo. Desactivado: totalmente gratis."
 RGO_toggle_cooldown:0 "Enfriamiento on/off"
 RGO_toggle_cooldown_desc:0 "Activado: cada cambio impone 6 meses de enfriamiento. Desactivado: sin enfriamiento y se elimina el actual al instante."
 RGO_toggle_produced:0 "Manufacturas on/off"
 RGO_toggle_produced_desc:0 "Muestra u oculta el botón Manufacturas. Desactivado por defecto."
 RGO_toggle_geo:0 "Geografía on/off"
 RGO_toggle_geo_desc:0 "Activado: solo se ofrecen los lugares donde el juego permite ese bien (clima, vegetación, relieve, región). Desactivado: cualquier lugar propio puede recibir cualquier materia prima. Desactivado por defecto."

 # Current state shown in the switch tooltip (chosen by trigger at hover time)
 RGO_toggle_state_on:0 "Ahora: ACTIVADO - pulsa para desactivar"
 RGO_toggle_state_off:0 "Ahora: DESACTIVADO - pulsa para activar"

