 hint_UnconditionallyChangeRGO_hint_text:0 "Hammaddeler\n\nBir kategoriye tıklayın, ardından hammaddeyi ve yeri seçin. Anahtarlar her tıklamada açılıp kapanır.\n\n- Maliyet: seçilen malın o yerin piyasasındaki güncel fiyatını altı kademede tahsil eder (yaklaşık 5 / 10 / 16 / 24 / 34 / 50 altın). Kapalı: her şey ücretsiz.\n- Bekleme: her değişiklik 6 ay bekleme başlatır ve düğmeler grileşir. Kapatmak süren beklemeyi hemen siler.\n- Mamul mallar: varsayılan olarak kapalı. Binalarda üretilirler; hammadde olarak kullanmak vanilla davranışı değildir ve üretimi bozabilir.\n- Coğrafya: varsayılan olarak kapalı. Kapalıyken iklim, bitki örtüsü veya arazi izin vermese de her yer herhangi bir hammaddeye çevrilebilir. Açıkken yalnızca oyunun kabul ettiği yerler listelenir.\n\nKategorideki malları görmek için bir düğmenin üzerine gelin."

