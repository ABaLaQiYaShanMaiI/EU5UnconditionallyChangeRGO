l_japanese:
 # Generated by tools\generate_rgo_localization.ps1 - do not edit by hand
 # Category descriptions describe the runtime goods rules (no fixed goods list)

 # Situation
 UnconditionallyChangeRGO:0 "原材料"
 UnconditionallyChangeRGO_desc:0 "自国が所有する任意の地点の原材料を、無料または市場価格で変更します。"

 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "原材料"
 hint_UnconditionallyChangeRGO_hint_text:0 "原材料\n\nカテゴリボタンを押し、原材料と地点を選びます。スイッチはクリックするたびに切り替わります。\n\n- 費用：選択した財の現地市場価格を6段階で支払います（約 5 / 10 / 16 / 24 / 34 / 50 金）。オフならすべて無料。\n- クールダウン：変更ごとに 6 か月のクールダウンが発生し、ボタンが無効になります。オフにすると進行中のクールダウンは即座に解除されます。\n- 加工品：既定ではオフ。加工品は建物が生産するため、原材料として使うのは本来の仕様ではなく、建物の生産を壊す可能性があります。\n- 地理条件：既定ではオフ。オフなら気候・植生・地形が許さない場合でも自国のどの地点でも任意の原材料に変更できます。オンにすると原版で認められる地点だけが候補になります。\n- 互換性：分類は実行時に財自身のデータ（カテゴリ・採取方法・食糧値）から判定するため、他の MOD や今後のパッチで追加された財も自動的に正しい分類に入ります。「プランテーション」だけは MOD のビルド時の原版リストを使います。\n\nボタンにカーソルを合わせると、そのカテゴリの判定ルールが表示されます。"

 # Action card title (overrides the engine UI-library placeholder title)
 RGO_CARD_HEADER:0 "原材料の操作"

 # Selection steps
 RGO_select_goods:0 "原材料を選択"
 RGO_select_location:0 "地点を選択"
 RGO_no_goods_available:0 "@trigger_no!選択できる原材料がありません"
 RGO_no_locations_available:0 "@trigger_no!条件を満たす地点がありません"

 # Category buttons (7)
 RGO_change_mining:0 "鉱物"
 RGO_change_mining_desc:0 "鉱物系：採取方法が「採掘」の原材料。"
 RGO_change_gathering:0 "採集"
 RGO_change_gathering_desc:0 "採集系：採取方法が「採集」の原材料。"
 RGO_change_crops:0 "商品作物"
 RGO_change_crops_desc:0 "商品作物・奢侈原材料：採取方法が「農耕」で、食糧でもプランテーション作物でもない原材料。"
 RGO_change_food:0 "食糧"
 RGO_change_food_desc:0 "食糧系：採取方法が「農耕」で食糧を生む原材料。"
 RGO_change_plantation:0 "プランテーション"
 RGO_change_plantation_desc:0 "プランテーション作物：原版のプランテーション作物。"
 RGO_change_wild:0 "狩猟・林業"
 RGO_change_wild_desc:0 "狩猟・林業系：採掘・採集・農耕のいずれでもない原材料。"
 RGO_change_produced:0 "加工品"
 RGO_change_produced_desc:0 "加工品：カテゴリが「加工品」の財（奴隷を除く）。\n本来の仕様ではなく、建物の生産を壊す可能性があります。既定ではオフ。下のスイッチで有効化できます。"

 # Switches (4)
 RGO_toggle_cost:0 "費用 オン/オフ"
 RGO_toggle_cost_desc:0 "オン：現地市場価格を6段階で請求します（約 5 / 10 / 16 / 24 / 34 / 50 金）。供給不足時は上の段階になります。オフ：完全無料。"
 RGO_toggle_cooldown:0 "クールダウン オン/オフ"
 RGO_toggle_cooldown_desc:0 "オン：変更ごとに 6 か月のクールダウン。オフ：クールダウンなし、進行中のものは即座に解除。"
 RGO_toggle_produced:0 "加工品 オン/オフ"
 RGO_toggle_produced_desc:0 "「加工品」ボタンの表示を切り替えます。既定ではオフ。"
 RGO_toggle_geo:0 "地理条件 オン/オフ"
 RGO_toggle_geo_desc:0 "オン：その財を原材料にできる地点（気候・植生・地形・地域）だけが候補になります。オフ：自国のどの地点でも任意の原材料に変更できます。既定ではオフ。"

 # Current state shown in the switch tooltip (chosen by trigger at hover time)
 RGO_toggle_state_on:0 "現在：オン - クリックでオフ"
 RGO_toggle_state_off:0 "現在：オフ - クリックでオン"

 # Price name (confirmation dialog)
 rgo_change:0 "原材料を変更"

 # Cooldown static modifier
 STATIC_MODIFIER_NAME_rgo_change_cooldown:0 "原材料クールダウン"
 STATIC_MODIFIER_DESC_rgo_change_cooldown:0 "原材料の変更はクールダウン中です。終了まで再変更できません。"
