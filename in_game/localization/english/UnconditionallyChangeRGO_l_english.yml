l_english:
 # Generated by tools\generate_rgo_localization.ps1 - do not edit by hand
 # Goods names come from the vanilla goods_l_<lang>.yml; counts and lists from common\goods

 # Situation
 UnconditionallyChangeRGO:0 "Raw Materials"
 UnconditionallyChangeRGO_desc:0 "Change the raw material of any location you own - free of charge or at market price."

 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "Raw Materials"
 hint_UnconditionallyChangeRGO_hint_text:0 "Raw Materials\n\nClick a category button, then pick a raw material and a location. Click a switch to toggle it.\n\n- Cost: pay the live market price of the chosen good in that market, on six tiers (about 5 / 10 / 16 / 24 / 34 / 50 gold). Off: everything is free.\n- Cooldown: every change starts a 6 month cooldown and the buttons grey out. Turning it off clears a running cooldown immediately.\n- Manufactured: off by default. Manufactured goods are made by buildings, so using them as raw materials is not vanilla behaviour and may break building output.\n\nHover a button to see which goods its category contains."

 # Action card title (overrides the engine UI-library placeholder title)
 RGO_CARD_HEADER:0 "Raw Material Actions"

 # Selection steps
 RGO_select_goods:0 "Select Raw Material"
 RGO_select_location:0 "Select Location"
 RGO_no_goods_available:0 "@trigger_no!No raw materials available"
 RGO_no_locations_available:0 "@trigger_no!No eligible locations available"

 # Category buttons (7)
 RGO_change_mining:0 "Mining"
 RGO_change_mining_desc:0 "Mining goods (13): Alum, Coal, Copper, Gems, Gold, Iron, Lead, Marble, Mercury, Saltpeter, Silver, Stone, Tin."
 RGO_change_gathering:0 "Gathering"
 RGO_change_gathering_desc:0 "Gathered goods (7): Amber, Clay, Fish, Medicaments, Pearls, Salt, Sand."
 RGO_change_crops:0 "Cash Crops"
 RGO_change_crops_desc:0 "Cash crops and luxury raw materials (14): Camels, Chili, Cloves, Cocoa, Coffee, Dyes, Elephants, Fiber Crops, Incense, Pepper, Saffron, Silk, Tea, Wine."
 RGO_change_food:0 "Food"
 RGO_change_food_desc:0 "Food goods (12): Beeswax, Fruit, Horses, Legumes, Livestock, Maize, Sturdy Grains, Olives, Potatoes, Rice, Wheat, Wool."
 RGO_change_plantation:0 "Plantation"
 RGO_change_plantation_desc:0 "Plantation goods (3): Cotton, Sugar, Tobacco."
 RGO_change_wild:0 "Hunting"
 RGO_change_wild_desc:0 "Hunting and forestry goods (4): Fur, Ivory, Lumber, Wild Game."
 RGO_change_produced:0 "Manufactured"
 RGO_change_produced_desc:0 "Manufactured goods (21): Beer, Books, Cannon, Cloth, Fine Cloth, Firearms, Furniture, Glass, Jewelry, Lacquerware, Leather, Liquor, Masonry, Naval Supplies, Paper, Porcelain, Pottery, Steel, Tar, Tools, Weaponry.\nNot vanilla behaviour and may break building output. Off by default - enable it with the switch below."

 # Switches (3)
 RGO_toggle_cost:0 "Cost on/off"
 RGO_toggle_cost_desc:0 "On: charges the chosen good's live market price on six tiers (about 5 / 10 / 16 / 24 / 34 / 50 gold); when supply runs short the price moves up a tier. Off: completely free."
 RGO_toggle_cooldown:0 "Cooldown on/off"
 RGO_toggle_cooldown_desc:0 "On: every change starts a 6 month cooldown. Off: no cooldown, and any running one is cleared immediately."
 RGO_toggle_produced:0 "Manufactured on/off"
 RGO_toggle_produced_desc:0 "Show or hide the Manufactured button. Off by default."

 # Current state shown in the switch tooltip (chosen by trigger at hover time)
 RGO_toggle_state_on:0 "Current: ON - click to turn it off"
 RGO_toggle_state_off:0 "Current: OFF - click to turn it on"

 # Price name (confirmation dialog)
 rgo_change:0 "Change Raw Material"

