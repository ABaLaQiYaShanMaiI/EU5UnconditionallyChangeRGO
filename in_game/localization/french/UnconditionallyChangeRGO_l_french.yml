l_french:
 # Generated by tools\generate_rgo_localization.ps1 - do not edit by hand
 # Goods names come from the vanilla goods_l_<lang>.yml; counts and lists from common\goods

 # Situation
 UnconditionallyChangeRGO:0 "Matières premières"
 UnconditionallyChangeRGO_desc:0 "Change la matière première de n'importe quel lieu vous appartenant, gratuitement ou au prix du marché."

 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "Matières premières"
 hint_UnconditionallyChangeRGO_hint_text:0 "Matières premières\n\nCliquez sur une catégorie, puis choisissez une matière première et un lieu. Les interrupteurs se basculent au clic.\n\n- Coût : paie le prix réel du marché local, en six paliers (environ 5 / 10 / 16 / 24 / 34 / 50 or). Désactivé : tout est gratuit.\n- Recharge : chaque changement impose 6 mois de recharge et grise les boutons. La désactiver annule immédiatement la recharge en cours.\n- Produits manufacturés : désactivé par défaut. Ils sont fabriqués par des bâtiments ; les utiliser comme matières premières n'est pas le comportement vanilla et peut perturber la production.\n- Géographie : désactivée par défaut. Désactivée, n'importe quel lieu vous appartenant accepte n'importe quelle matière première, même si le climat, la végétation ou le relief ne le permettent pas en vanilla. Activée, seuls les lieux acceptés par le jeu sont proposés.\n\nSurvolez un bouton pour voir les biens de sa catégorie."

 # Action card title (overrides the engine UI-library placeholder title)
 RGO_CARD_HEADER:0 "Actions sur les matières premières"

 # Selection steps
 RGO_select_goods:0 "Choisir une matière première"
 RGO_select_location:0 "Choisir un lieu"
 RGO_no_goods_available:0 "@trigger_no!Aucune matière première disponible"
 RGO_no_locations_available:0 "@trigger_no!Aucun lieu éligible"

 # Category buttons (7)
 RGO_change_mining:0 "Mines"
 RGO_change_mining_desc:0 "Biens miniers (13) : Alun, Charbon, Cuivre, Pierres précieuses, Or, Fer, Plomb, Marbre, Mercure, Salpêtre, Argent, Pierre, Étain."
 RGO_change_gathering:0 "Cueillette"
 RGO_change_gathering_desc:0 "Biens de cueillette (7) : Ambre, Argile, Poisson, Médicaments, Perles, Sel, Sable."
 RGO_change_crops:0 "Cultures commerciales"
 RGO_change_crops_desc:0 "Cultures commerciales et matières premières de luxe (14) : Chameaux, Piment, Clous de girofle, Cacao, Café, Teintures, Éléphants, Plantes textiles, Encens, Poivre, Safran, Soie, Thé, Vin."
 RGO_change_food:0 "Nourriture"
 RGO_change_food_desc:0 "Biens alimentaires (12) : Cire d'abeille, Fruits, Chevaux, Légumineuses, Bétail, Maïs, Céréales robustes, Olives, Pomme de terre, Riz, Blé, Laine."
 RGO_change_plantation:0 "Plantations"
 RGO_change_plantation_desc:0 "Biens de plantation (3) : Coton, Sucre, Tabac."
 RGO_change_wild:0 "Chasse et forêt"
 RGO_change_wild_desc:0 "Biens de chasse et de forêt (4) : Fourrures, Ivoire, Bois, Gibier."
 RGO_change_produced:0 "Produits manufacturés"
 RGO_change_produced_desc:0 "Produits manufacturés (21) : Bière, Livres, Canons, Étoffes, Tissus fins, Armes à feu, Meubles, Verre, Bijoux, Objets laqués, Cuir, Spiritueux, Maçonnerie, Fournitures navales, Papier, Porcelaine, Poterie, Acier, Goudron, Outils, Armes.\nComportement non vanilla, peut perturber la production. Désactivé par défaut."

 # Switches (4)
 RGO_toggle_cost:0 "Coût act./dés."
 RGO_toggle_cost_desc:0 "Activé : facture le prix réel du marché local en six paliers (environ 5 / 10 / 16 / 24 / 34 / 50 or) ; en cas de pénurie, le palier augmente. Désactivé : entièrement gratuit."
 RGO_toggle_cooldown:0 "Recharge act./dés."
 RGO_toggle_cooldown_desc:0 "Activé : chaque changement impose 6 mois de recharge. Désactivé : aucune recharge, et celle en cours est annulée immédiatement."
 RGO_toggle_produced:0 "Manufacturés act./dés."
 RGO_toggle_produced_desc:0 "Affiche ou masque le bouton Manufacturés. Désactivé par défaut."
 RGO_toggle_geo:0 "Géographie act./dés."
 RGO_toggle_geo_desc:0 "Activé : seuls les lieux où le jeu autorise ce bien (climat, végétation, relief, région) sont proposés. Désactivé : n'importe quel lieu vous appartenant accepte n'importe quelle matière première. Désactivé par défaut."

 # Current state shown in the switch tooltip (chosen by trigger at hover time)
 RGO_toggle_state_on:0 "Actuellement : ACTIVÉ - cliquez pour désactiver"
 RGO_toggle_state_off:0 "Actuellement : DÉSACTIVÉ - cliquez pour activer"

 # Price name (confirmation dialog)
 rgo_change:0 "Changer la matière première"

 # Cooldown static modifier
 STATIC_MODIFIER_NAME_rgo_change_cooldown:0 "Recharge des matières premières"
 STATIC_MODIFIER_DESC_rgo_change_cooldown:0 "Le changement de matière première est en recharge ; aucune modification n'est possible avant son expiration."
