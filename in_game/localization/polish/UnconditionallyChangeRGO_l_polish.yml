 RGO_no_locations_available:0 "@trigger_no!Brak odpowiednich lokalizacji"

 # Category buttons (7)
 RGO_change_mining:0 "Górnictwo"
 RGO_change_mining_desc:0 "Surowce górnicze (13): Ałun, Węgiel, Miedź, Kamienie szlachetne, Złoto, Żelazo, Ołów, Marmur, Rtęć, Saletra, Srebro, Kamień, Cyna."
 RGO_change_gathering:0 "Zbieractwo"
 RGO_change_gathering_desc:0 "Surowce zbierane (7): Bursztyn, Glina, Ryby, Leki, Perły, Sól, Piasek."
 RGO_change_crops:0 "Uprawy towarowe"
 RGO_change_crops_desc:0 "Uprawy towarowe i surowce luksusowe (14): Wielbłądy, Chili, Goździki, Kakao, Kawa, Barwniki, Słonie, Rośliny włókniste, Kadzidło, Pieprz, Szafran, Jedwab, Herbata, Wino."
 RGO_change_food:0 "Żywność"
 RGO_change_food_desc:0 "Surowce żywnościowe (12): Wosk pszczeli, Owoce, Konie, Rośliny strączkowe, Zwierzęta gospodarskie, Kukurydza, Wytrzymałe odmiany zbóż, Oliwki, Ziemniaki, Ryż, Pszenica, Wełna."
 RGO_change_plantation:0 "Plantacje"
 RGO_change_plantation_desc:0 "Surowce plantacyjne (3): Bawełna, Cukier, Tytoń."
 RGO_change_wild:0 "Łowiectwo i las"
 RGO_change_wild_desc:0 "Surowce łowieckie i leśne (4): Futro, Kość słoniowa, Drewno, Dziczyzna."
 RGO_change_produced:0 "Wyroby"
 RGO_change_produced_desc:0 "Wyroby (21): Piwo, Księgi, Działa, Tkaniny, Odzież wysokiej jakości, Broń palna, Meble, Szkło, Biżuteria, Lakiernictwo artystyczne, Skóra, Alkohol, Ociosane kamienie, Zapasy okrętowe, Papier, Porcelana, Wyroby garncarskie, Stal, Smoła, Narzędzia, Broń.\nZachowanie inne niż vanilla, może zakłócić produkcję. Domyślnie wyłączone."

 # Switches (3)
 RGO_toggle_cost:0 "Koszt wł./wył."
 RGO_toggle_cost_desc:0 "Wł.: opłata według bieżącej ceny rynkowej w sześciu progach (około 5 / 10 / 16 / 24 / 34 / 50 złota); przy niedoborze próg rośnie. Wył.: całkowicie bezpłatnie."
 RGO_toggle_cooldown:0 "Odnowienie wł./wył."
 RGO_toggle_cooldown_desc:0 "Wł.: każde użycie daje 6 miesięcy odnowienia. Wył.: brak odnowienia, a trwające jest natychmiast usuwane."
 RGO_toggle_produced:0 "Wyroby wł./wył."
 RGO_toggle_produced_desc:0 "Pokazuje lub ukrywa przycisk Wyroby. Domyślnie wyłączone."

