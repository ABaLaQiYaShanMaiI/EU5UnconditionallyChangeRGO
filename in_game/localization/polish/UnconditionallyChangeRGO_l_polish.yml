 # Situation
 UnconditionallyChangeRGO:0 "Surowce"
 UnconditionallyChangeRGO_desc:0 "Zmienia surowiec dowolnej należącej do was lokalizacji: bez opłat lub po cenie rynkowej."

 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "Surowce"
 hint_UnconditionallyChangeRGO_hint_text:0 "Surowce\n\nKliknij kategorię, a następnie wybierz surowiec i lokalizację. Przełączniki zmieniają stan po kliknięciu.\n\n- Koszt: opłata według bieżącej ceny rynkowej towaru w sześciu progach (około 5 / 10 / 16 / 24 / 34 / 50 złota). Wył.: wszystko bezpłatnie.\n- Odnowienie: każde użycie daje 6 miesięcy odnowienia, a przyciski szarzeją. Wyłączenie natychmiast usuwa trwające odnowienie.\n- Wyroby: domyślnie wyłączone. Wyroby powstają w budynkach, więc użycie ich jako surowca nie jest zachowaniem vanilla i może zakłócić produkcję.\n\nNajedź na przycisk, aby zobaczyć towary w kategorii."

