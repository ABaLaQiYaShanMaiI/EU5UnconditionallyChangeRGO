 RGO_change_plantation_desc:0 "Surowce plantacyjne: uprawy plantacyjne z wersji podstawowej."
 RGO_change_wild:0 "Łowiectwo i las"
 RGO_change_wild_desc:0 "Surowce łowieckie i leśne: surowce, których nie wydobywa się, nie zbiera ani nie uprawia."
 RGO_change_produced:0 "Wyroby"
 RGO_change_produced_desc:0 "Wyroby: towary z kategorii wyrobów (bez niewolników).\nZachowanie inne niż vanilla, może zakłócić produkcję. Domyślnie wyłączone - włącz przełącznikiem poniżej."

