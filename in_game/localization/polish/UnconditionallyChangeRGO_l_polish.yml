 RGO_toggle_cost_desc:0 "Wł.: opłata według bieżącej ceny rynkowej w sześciu progach (około 5 / 10 / 16 / 24 / 34 / 50 złota); przy niedoborze próg rośnie. Wył.: całkowicie bezpłatnie."
 RGO_toggle_cooldown:0 "Odnowienie wł./wył."
 RGO_toggle_cooldown_desc:0 "Wł.: każde użycie daje 6 miesięcy odnowienia. Wył.: brak odnowienia, a trwające jest natychmiast usuwane."
 RGO_toggle_produced:0 "Wyroby wł./wył."
 RGO_toggle_produced_desc:0 "Pokazuje lub ukrywa przycisk Wyroby. Domyślnie wyłączone."
 RGO_toggle_geo:0 "Geografia wł./wył."
 RGO_toggle_geo_desc:0 "Wł.: pokazywane są tylko lokalizacje, w których gra dopuszcza ten towar (klimat, roślinność, ukształtowanie, region). Wył.: każda własna lokalizacja może otrzymać dowolny surowiec. Domyślnie wyłączone."

