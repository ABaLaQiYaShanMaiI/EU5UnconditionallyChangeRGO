 # Situation
 UnconditionallyChangeRGO:0 "원자재"
 UnconditionallyChangeRGO_desc:0 "보유한 모든 지역의 원자재를 무료 또는 시장 가격으로 변경합니다."

 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "원자재"
 hint_UnconditionallyChangeRGO_hint_text:0 "원자재\n\n분류 버튼을 누른 뒤 원자재와 지역을 선택하세요. 스위치는 클릭할 때마다 전환됩니다.\n\n- 비용: 선택한 상품의 해당 지역 시장 실시간 가격을 6단계로 지불합니다(약 5 / 10 / 16 / 24 / 34 / 50 골드). 끄면 전부 무료.\n- 재사용 대기: 변경할 때마다 6개월 대기 시간이 생기고 버튼이 비활성화됩니다. 끄면 진행 중인 대기도 즉시 해제됩니다.\n- 가공품: 기본적으로 꺼져 있습니다. 가공품은 건물이 생산하므로 원자재로 쓰는 것은 원작 동작이 아니며 건물 생산을 깨뜨릴 수 있습니다.\n- 지리 조건: 기본적으로 꺼져 있습니다. 끄면 기후·식생·지형이 허용하지 않아도 모든 지역을 어떤 원자재로든 바꿀 수 있습니다. 켜면 원작에서 허용되는 지역만 표시됩니다.\n- 호환성: 분류는 실행 중에 상품 자체의 데이터(분류, 채집 방식, 식량 값)로 판정하므로 다른 모드나 이후 패치가 추가한 상품도 알맞은 분류에 자동으로 들어갑니다. 다만 플랜테이션만은 모드 빌드 시의 원작 목록을 사용합니다.\n\n버튼에 마우스를 올리면 해당 분류의 판정 규칙을 볼 수 있습니다."

 # Action card title (overrides the engine UI-library placeholder title)
