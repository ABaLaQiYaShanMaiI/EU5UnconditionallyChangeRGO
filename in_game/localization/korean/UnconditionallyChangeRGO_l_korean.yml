 STATIC_MODIFIER_NAME_rgo_change_cooldown:0 "원자재 재사용 대기"
 STATIC_MODIFIER_DESC_rgo_change_cooldown:0 "원자재 변경이 재사용 대기 중입니다. 끝날 때까지 다시 변경할 수 없습니다."
