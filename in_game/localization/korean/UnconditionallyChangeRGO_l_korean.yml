 RGO_select_goods:0 "원자재 선택"
 RGO_select_location:0 "지역 선택"
 RGO_no_goods_available:0 "@trigger_no!선택 가능한 원자재가 없습니다"
 RGO_no_locations_available:0 "@trigger_no!조건에 맞는 지역이 없습니다"

 # Category buttons (7)
 RGO_change_mining:0 "광물"
 RGO_change_mining_desc:0 "광물류: 채굴 방식으로 얻는 원자재."
 RGO_change_gathering:0 "채집"
 RGO_change_gathering_desc:0 "채집류: 채집 방식으로 얻는 원자재."
 RGO_change_crops:0 "상품 작물"
 RGO_change_crops_desc:0 "상품 작물: 농사 방식이면서 식량도 플랜테이션 작물도 아닌 원자재."
 RGO_change_food:0 "식량"
 RGO_change_food_desc:0 "식량류: 농사 방식이며 식량을 제공하는 원자재."
 RGO_change_plantation:0 "플랜테이션"
 RGO_change_plantation_desc:0 "플랜테이션 작물: 원작의 플랜테이션 작물."
 RGO_change_wild:0 "수렵·임업"
 RGO_change_wild_desc:0 "수렵·임업류: 채굴·채집·농사 어느 것도 아닌 원자재."
 RGO_change_produced:0 "가공품"
 RGO_change_produced_desc:0 "가공품: 분류가 가공품인 상품(노예 제외).\n원작 동작이 아니며 건물 생산을 깨뜨릴 수 있습니다. 기본적으로 꺼져 있으며 아래 스위치로 켭니다."

 # Switches (4)
 RGO_toggle_cost:0 "비용 켜기/끄기"
 RGO_toggle_cost_desc:0 "켜기: 실시간 시장 가격을 6단계로 청구합니다(약 5 / 10 / 16 / 24 / 34 / 50 골드). 공급이 부족하면 더 높은 단계가 적용됩니다. 끄기: 완전 무료."
 RGO_toggle_cooldown:0 "재사용 대기 켜기/끄기"
 RGO_toggle_cooldown_desc:0 "켜기: 변경할 때마다 6개월 대기. 끄기: 대기 없음, 진행 중인 대기는 즉시 해제."
 RGO_toggle_produced:0 "가공품 켜기/끄기"
 RGO_toggle_produced_desc:0 "가공품 버튼을 표시하거나 숨깁니다. 기본적으로 꺼져 있습니다."
 RGO_toggle_geo:0 "지리 조건 켜기/끄기"
 RGO_toggle_geo_desc:0 "켜기: 게임이 해당 상품을 허용하는 지역(기후, 식생, 지형, 지방)만 표시됩니다. 끄기: 소유한 모든 지역을 어떤 원자재로든 바꿀 수 있습니다. 기본적으로 꺼져 있습니다."

 # Current state shown in the switch tooltip (chosen by trigger at hover time)
 RGO_toggle_state_on:0 "현재: 켜짐 - 클릭하면 꺼짐"
 RGO_toggle_state_off:0 "현재: 꺼짐 - 클릭하면 켜짐"

