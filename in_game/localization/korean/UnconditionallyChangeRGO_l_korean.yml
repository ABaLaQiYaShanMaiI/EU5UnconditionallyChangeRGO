 # Category buttons (7)
 RGO_change_mining:0 "광물"
 RGO_change_mining_desc:0 "광물류(13종): 백반, 석탄, 구리, 보석, 금, 철, 납, 대리석, 수은, 초석, 은, 돌, 주석."
 RGO_change_gathering:0 "채집"
 RGO_change_gathering_desc:0 "채집류(7종): 호박, 점토, 생선, 의약품, 진주, 소금, 모래."
 RGO_change_crops:0 "상품 작물"
 RGO_change_crops_desc:0 "상품 작물 및 사치 원자재(14종): 낙타, 고추, 정향, 코코아, 커피, 염료, 코끼리, 섬유 작물, 향, 후추, 사프란, 비단, 차, 와인."
 RGO_change_food:0 "식량"
 RGO_change_food_desc:0 "식량류(12종): 밀랍, 과일, 말, 콩과 식물, 가축, 옥수수, 잡곡, 올리브, 감자, 쌀, 밀, 양모."
 RGO_change_plantation:0 "플랜테이션"
 RGO_change_plantation_desc:0 "플랜테이션 작물(3종): 목화, 설탕, 담배."
 RGO_change_wild:0 "수렵·임업"
 RGO_change_wild_desc:0 "수렵·임업류(4종): 모피, 상아, 목재, 야생 동물."
 RGO_change_produced:0 "가공품"
 RGO_change_produced_desc:0 "가공품(21종): 맥주, 책, 대포, 옷감, 고급 옷감, 화기, 가구, 유리, 보석 세공품, 칠기, 가죽, 증류주, 석조, 해상 보급품, 종이, 자기, 도기, 강철, 타르, 도구, 무기.\n원작 동작이 아니며 건물 생산을 깨뜨릴 수 있습니다. 기본적으로 꺼져 있습니다."

 # Switches (4)
 RGO_toggle_cost:0 "비용 켜기/끄기"
 RGO_toggle_cost_desc:0 "켜기: 실시간 시장 가격을 6단계로 청구합니다(약 5 / 10 / 16 / 24 / 34 / 50 골드). 공급이 부족하면 더 높은 단계가 적용됩니다. 끄기: 완전 무료."
 RGO_toggle_cooldown:0 "재사용 대기 켜기/끄기"
 RGO_toggle_cooldown_desc:0 "켜기: 변경할 때마다 6개월 대기. 끄기: 대기 없음, 진행 중인 대기는 즉시 해제."
 RGO_toggle_produced:0 "가공품 켜기/끄기"
 RGO_toggle_produced_desc:0 "가공품 버튼을 표시하거나 숨깁니다. 기본적으로 꺼져 있습니다."
 RGO_toggle_geo:0 "지리 조건 켜기/끄기"
 RGO_toggle_geo_desc:0 "켜기: 게임이 해당 상품을 허용하는 지역(기후, 식생, 지형, 지방)만 표시됩니다. 끄기: 소유한 모든 지역을 어떤 원자재로든 바꿀 수 있습니다. 기본적으로 꺼져 있습니다."

