 # Situation
 UnconditionallyChangeRGO:0 "Ресурсы"
 UnconditionallyChangeRGO_desc:0 "Меняет сырьё любой принадлежащей вам территории: бесплатно или по рыночной цене."

 # Scriptable hint: short title in the list, long text in _hint_text
 hint_UnconditionallyChangeRGO:0 "Ресурсы"
 hint_UnconditionallyChangeRGO_hint_text:0 "Ресурсы\n\nНажмите кнопку категории, затем выберите сырьё и территорию. Переключатели срабатывают по нажатию.\n\n- Стоимость: оплата по текущей рыночной цене выбранного товара на рынке этой территории, шесть уровней (примерно 5 / 10 / 16 / 24 / 34 / 50 золота). Выкл.: всё бесплатно.\n- Перезарядка: каждое изменение даёт 6 месяцев перезарядки, кнопки становятся неактивными. Выключение сразу снимает текущую перезарядку.\n- Изделия: по умолчанию выключено. Изделия производят здания, поэтому использование их как сырья не является ванильным поведением и может нарушить производство.\n- География: по умолчанию выключено. Выкл.: любую свою территорию можно сделать любым сырьём, даже если климат, растительность или рельеф этого не допускают. Вкл.: только территории, допустимые в игре.\n- Совместимость: категории определяются на лету по свойствам самого товара (категория, способ добычи, пищевая ценность), поэтому товары из других модов и будущих патчей попадают в нужную категорию автоматически. Только «Плантации» используют список, зафиксированный при сборке мода.\n\nНаведите курсор на кнопку, чтобы увидеть правило категории."

 # Action card title (overrides the engine UI-library placeholder title)
 RGO_CARD_HEADER:0 "Действия с сырьём"

