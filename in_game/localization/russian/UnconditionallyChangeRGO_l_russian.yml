 # Category buttons (7)
 RGO_change_mining:0 "Добыча"
 RGO_change_mining_desc:0 "Добываемое сырьё: товары со способом добычи «горное дело»."
 RGO_change_gathering:0 "Сбор"
 RGO_change_gathering_desc:0 "Собираемое сырьё: товары со способом добычи «сбор»."
 RGO_change_crops:0 "Технические культуры"
 RGO_change_crops_desc:0 "Технические культуры: сельскохозяйственное сырьё, не являющееся ни продовольствием, ни плантационной культурой."
 RGO_change_food:0 "Продовольствие"
 RGO_change_food_desc:0 "Продовольствие: сельскохозяйственное сырьё, дающее еду."
 RGO_change_plantation:0 "Плантации"
 RGO_change_plantation_desc:0 "Плантационные культуры: культуры из ванильного списка плантаций."
 RGO_change_wild:0 "Охота и лес"
 RGO_change_wild_desc:0 "Охотничье и лесное сырьё: сырьё, которое не добывается, не собирается и не выращивается."
 RGO_change_produced:0 "Изделия"
 RGO_change_produced_desc:0 "Изделия: товары категории «изделия» (кроме рабов).\nНе ванильное поведение, может нарушить производство. По умолчанию выключено, включите переключателем ниже."

 # Switches (4)
 RGO_toggle_cost:0 "Стоимость вкл/выкл"
 RGO_toggle_cost_desc:0 "Вкл.: плата по текущей рыночной цене товара, шесть уровней (примерно 5 / 10 / 16 / 24 / 34 / 50 золота); при нехватке предложения уровень повышается. Выкл.: бесплатно."
 RGO_toggle_cooldown:0 "Перезарядка вкл/выкл"
 RGO_toggle_cooldown_desc:0 "Вкл.: каждое изменение даёт 6 месяцев перезарядки. Выкл.: перезарядки нет, текущая снимается сразу."
 RGO_toggle_produced:0 "Изделия вкл/выкл"
 RGO_toggle_produced_desc:0 "Показать или скрыть кнопку «Изделия». По умолчанию выключено."
 RGO_toggle_geo:0 "География вкл/выкл"
 RGO_toggle_geo_desc:0 "Вкл.: показываются только территории, где игра сама допускает этот товар (климат, растительность, рельеф, регион). Выкл.: любую свою территорию можно сделать любым сырьём. По умолчанию выключено."

