 hint_UnconditionallyChangeRGO_hint_text:0 "Ресурсы\n\nНажмите кнопку категории, затем выберите сырьё и территорию. Переключатели срабатывают по нажатию.\n\n- Стоимость: оплата по текущей рыночной цене выбранного товара на рынке этой территории, шесть уровней (примерно 5 / 10 / 16 / 24 / 34 / 50 золота). Выкл.: всё бесплатно.\n- Перезарядка: каждое изменение даёт 6 месяцев перезарядки, кнопки становятся неактивными. Выключение сразу снимает текущую перезарядку.\n- Изделия: по умолчанию выключено. Изделия производят здания, поэтому использование их как сырья не является ванильным поведением и может нарушить производство.\n\nНаведите курсор на кнопку, чтобы увидеть список товаров категории."

