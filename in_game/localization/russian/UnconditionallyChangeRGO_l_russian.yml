l_russian:
 # Ситуация
 UnconditionallyChangeRGO:0 "Сырьё"
 UnconditionallyChangeRGO_desc:0 "Меняет сырьё любой вашей территории: бесплатно или по рыночной цене."
 hint_UnconditionallyChangeRGO:0 "Сырьё\n\nСемь кнопок сверху начинают изменение (выбрать сырьё, затем территорию).\nДевять переключателей ниже срабатывают по нажатию.\n\n- Стоимость: при включении вы платите текущую рыночную цену выбранного товара на рынке этой территории (примерно 5-60 золота, колеблется от спроса и предложения); при выключении всё бесплатно\n- Перезарядка: при включении каждое изменение даёт 6 месяцев перезарядки, кнопки становятся неактивными; выключение сразу снимает текущую перезарядку\n- Промышленность: по умолчанию выключено. Промышленные товары производят здания, поэтому использование их как сырья не является ванильным поведением и может нарушить производство\n\nНаведите курсор на кнопку, чтобы увидеть список товаров категории."

 # Заголовок карточки
 RGO_CARD_TITLE:0 "Сырьё"

 # Шаги выбора
 select_goods:0 "Выбрать сырьё"
 select_location:0 "Выбрать территорию"
 trigger_no_rgo_goods:0 "Нет доступного сырья"
 trigger_no_rgo_locations:0 "Нет подходящих территорий"

 # Семь категорий (текст кнопок минимален, подробности в подсказке)
 RGO_change_mining:0 "Добыча"
 RGO_change_mining_desc:0 "Добываемое сырьё (13): уголь, железо, медь, золото, серебро, самоцветы, камень, олово, свинец, селитра, квасцы, мрамор, ртуть."
 RGO_change_gathering:0 "Сбор"
 RGO_change_gathering_desc:0 "Собираемое сырьё (7): глина, песок, соль, лекарства, жемчуг, янтарь, рыба."
 RGO_change_crops:0 "Культуры"
 RGO_change_crops_desc:0 "Технические культуры и роскошь (14): шёлк, красители, благовония, чай, какао, кофе, волокна, вино, слоны, верблюды, шафран, перец, гвоздика, чили."
 RGO_change_food:0 "Еда"
 RGO_change_food_desc:0 "Продовольствие (12): пшеница, кукуруза, рис, просо, бобовые, картофель, скот, шерсть, кони, оливы, фрукты, воск."
 RGO_change_plantation:0 "Плантации"
 RGO_change_plantation_desc:0 "Плантационные культуры (3): хлопок, сахар, табак."
 RGO_change_wild:0 "Охота"
 RGO_change_wild_desc:0 "Охотничье и лесное сырьё (4): слоновая кость, дичь, мех, древесина."
 RGO_change_industry:0 "Промышл."
 RGO_change_industry_desc:0 "Промышленные товары (22): ткани, бумага, стекло, фарфор, пушки, украшения… Не ванильное поведение, может нарушить производство. По умолчанию выключено."

 # Девять переключателей
 RGO_toggle_cost:0 "Стоимость вкл/выкл"
 RGO_toggle_cost_desc:0 "Вкл: плата по одному из шести уровней по текущей рыночной цене товара (примерно 5 / 10 / 16 / 24 / 34 / 50 золота); при нехватке предложения цена переходит на уровень выше. Выкл: бесплатно."
 RGO_toggle_cooldown:0 "Перезарядка вкл/выкл"
 RGO_toggle_cooldown_desc:0 "Вкл: каждое изменение даёт 6 месяцев перезарядки. Выкл: перезарядки нет, текущая снимается сразу."
 RGO_toggle_cat_industry:0 "Промышл. вкл/выкл"
 RGO_toggle_cat_industry_desc:0 "Показать или скрыть кнопку «Промышленность». По умолчанию выключено."

 # Модификатор перезарядки
 STATIC_MODIFIER_NAME_rgo_change_cooldown:0 "Перезарядка сырья"
 STATIC_MODIFIER_DESC_rgo_change_cooldown:0 "Изменение сырья на перезарядке; новые изменения невозможны до её окончания."

 rgo_change:0 "Изменить сырьё"
 RGO_GROUP_SWITCHES:0 "Переключатели"
